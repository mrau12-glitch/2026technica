<script>
  const closed_hi_hat = new Audio("/sounds/closed_hi_hat.mp3");
  const kick = new Audio("/sounds/kick.mp3");
  const snare = new Audio("/sounds/snare.mp3");
  const low_tom = new Audio("/sounds/low_tom.mp3");
  const open_hi_hat = new Audio("/sounds/open_hi_hat.mp3");
  const high_tom = new Audio("/sounds/high_tom.mp3");
  const bass = new Audio("/sounds/bass.mp3");
  const shaker = new Audio("/sounds/shaker.mp3");

document.addEventListener("keydown", (event) => {
  if (event.repeat) return;
  if (event.code === 'KeyA'){
  event.preventDefault();
  closed_hi_hat.currentTime = 0;
  playAudio(closed_hi_hat, "closed_hi_hat");
  }

  if (event.code === 'KeyS'){
  event.preventDefault();
  kick.currentTime = 0;
  playAudio(kick, "kick");
  }

  if (event.code === 'KeyD'){
  event.preventDefault();
  snare.currentTime = 0;
  playAudio(snare, "snare");
  }

  if (event.code === 'KeyF'){
  event.preventDefault();
  low_tom.currentTime = 0;
  playAudio(low_tom, "low_tom");
  }

  if (event.code === 'KeyJ'){
  event.preventDefault();
  open_hi_hat.currentTime = 0;
  playAudio(open_hi_hat, "open_hi_hat");
  }

  if (event.code === 'KeyK'){
  event.preventDefault();
  high_tom.currentTime = 0;
  playAudio(high_tom, "high_tom");
  }

  if (event.code === 'KeyL'){
  event.preventDefault();
  bass.currentTime = 0;
  playAudio(bass, "bass");
  }

  if (event.code === 'Semicolon'){
  event.preventDefault();
  shaker.currentTime = 0;
  playAudio(shaker, "shaker");
  }

    // Record this hit in the current track
    currentTrack.push({

}
});
</script>
