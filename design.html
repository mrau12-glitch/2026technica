<script>
  const closed_hi_hat = new Audio("/sounds/closed_hi_hat.mp3");
  const kick = new Audio("/sounds/kick.mp3");
  const snare = new Audio("/sounds/snare.mp3");
  const low_tom = new Audio("/sounds/low_tom.mp3");
  const open_hi_hat = new Audio("/sounds/open_hi_hat.mp3");
  const high_tom = new Audio("/sounds/high_tom.mp3");
  const bass = new Audio("/sounds/bass.mp3");
  const shaker = new Audio("/sounds/shaker.mp3");

  const drums={closed_hi_hat, kick, snare, low_tom, open_hi_hat, high_tom, bass, shaker};
  Object.values(drums).forEach(audio => {
    audio.preload = "auto";
    audio.load();
  });
  
  let tracks = [
    { notes: [], loopIntervalId: null, loopTimeoutIds: [] }
  ];
  
  let activeTrackIndex = 0;
  const loopDuration = 4000;
  let isPlaying = true; 

  // Completely silences all active loops across all tracks
  function stopAllTrackPlayback() {
      tracks.forEach(track => {
          track.loopTimeoutIds.forEach(id => clearTimeout(id));
          track.loopTimeoutIds = [];
          if (track.loopIntervalId) clearInterval(track.loopIntervalId);
      });
  }

  // Starts or refreshes looping for a specific track index
  function startSingleTrackPlayback(index) {
      const track = tracks[index];
      
      // Clear timers just for this track layer
      track.loopTimeoutIds.forEach(id => clearTimeout(id));
      track.loopTimeoutIds = [];
      if (track.loopIntervalId) clearInterval(track.loopIntervalId);

      if (!isPlaying || track.notes.length === 0) return;

      const firstNoteTime = track.notes[0].time;
      const lastNoteTime = track.notes[track.notes.length - 1].time;
      const dynamicDuration = Math.max(loopDuration, (lastNoteTime - firstNoteTime) + 500);

      function scheduleNotes() {
        track.notes.forEach(hit => {
          const delay = hit.time - firstNoteTime;
          const tId = setTimeout(() => playNote(hit.drum), delay);
          track.loopTimeoutIds.push(tId);
        });
      }
  }
  
  function playNote(drumName) {
      const original = drums[drumName];
      if (!original) return;

      const sound = original.cloneNode();
      sound.play().catch(console.error);
  }

  scheduleNotes();
      track.loopIntervalId = setInterval(() => {
        track.loopTimeoutIds.forEach(id => clearTimeout(id));
        track.loopTimeoutIds = [];
        scheduleNotes();
      }, dynamicDuration);

  // Refreshes playback for all tracks simultaneously (used for play/pause toggles)
  function startAllTrackPlayback() {
      tracks.forEach((_, index) => startSingleTrackPlayback(index));
  }

  // Triggered by the H key: Creates a fresh layer and targets it
  function addNewTrackLayer() {
      tracks.push({ notes: [], loopIntervalId: null, loopTimeoutIds: [] });
      activeTrackIndex = tracks.length - 1;
      console.log(`Created Track Layer #${tracks.length}. You are now recording on this new layer!`);
  }

  function playAudio(audio, drumName) {
      audio.play().catch(console.error);

      // Record specifically into the active track layer's notes array
      tracks[activeTrackIndex].notes.push({
          drum: drumName,
          time: performance.now()
      });

      console.log(`Track #${activeTrackIndex + 1} updated:`, tracks[activeTrackIndex].notes);

      isPlaying = true;
      
  }

  function togglePlayPause() {
      // Check if there are any notes across any of the layers
      const totalNotesCount = tracks.reduce((acc, t) => acc + t.notes.length, 0);
      if (totalNotesCount === 0) {
          console.log("All tracks are empty. Play a drum first!");
          return;
      }
      
      isPlaying = !isPlaying;
      
      if (isPlaying) {
          console.log("All tracks resumed");
          startAllTrackPlayback();
      } else {
          console.log("All tracks paused");
          stopAllTrackPlayback();
      }
  }

  function saveComposition() {
      // Check if there are any notes recorded across any layer
      const totalNotesCount = tracks.reduce((acc, t) => acc + t.notes.length, 0);
      if (totalNotesCount === 0) {
          console.log("Nothing to save! Play some notes first.");
          return;
      }
    const dataToSave = tracks.map(track => ({
          notes: track.notes
      }));
    const jsonString = JSON.stringify(dataToSave, null, 2);
      const blob = new Blob([jsonString], { type: "application/json" });
      const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
      a.href = url;
      a.download = "drum_composition.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      console.log("Composition saved and downloaded successfully!");
  }
  
document.addEventListener("keydown", (event) => {
  if (event.repeat) return;

  if (event.shiftKey && event.code === 'KeyS') {
    event.preventDefault();
    saveComposition();
    return; // Exit the listener early so it doesn't trigger the standard 'KeyS' kick drum
  }

  if (event.code === 'KeyG'){
    event.preventDefault();
    togglePlayPause();
  }
  
  if (event.code === 'KeyG'){
    event.preventDefault();
    togglePlayPause();
  }

  if (event.code === 'KeyH') {
    event.preventDefault();
    addNewTrackLayer();
  }
  
  if (event.code === 'KeyA'){
  event.preventDefault();
  closed_hi_hat.currentTime = 0;
  playAudio(closed_hi_hat, "closed_hi_hat");
  }

  if (event.code === 'KeyS'){
  event.preventDefault();
  kick.currentTime = 0;
  playAudio(kick, "kick");
  }

  if (event.code === 'KeyD'){
  event.preventDefault();
  snare.currentTime = 0;
  playAudio(snare, "snare");
  }

  if (event.code === 'KeyF'){
  event.preventDefault();
  low_tom.currentTime = 0;
  playAudio(low_tom, "low_tom");
  }

  if (event.code === 'KeyJ'){
  event.preventDefault();
  open_hi_hat.currentTime = 0;
  playAudio(open_hi_hat, "open_hi_hat");
  }

  if (event.code === 'KeyK'){
  event.preventDefault();
  high_tom.currentTime = 0;
  playAudio(high_tom, "high_tom");
  }

  if (event.code === 'KeyL'){
  event.preventDefault();
  bass.currentTime = 0;
  playAudio(bass, "bass");
  }

  if (event.code === 'Semicolon'){
  event.preventDefault();
  shaker.currentTime = 0;
  playAudio(shaker, "shaker");
  }
});
</script>
